name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 태그 (예: v1.0.0). 비우면 릴리스 없이 빌드만 합니다.'
        required: false
        default: ''

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        timeout-minutes: 25
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release asset
        if: env.RELEASE_TAG != ''
        run: cp app/build/outputs/apk/debug/app-debug.apk "sound-delay-${RELEASE_TAG}.apk"

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: 사운드 딜레이 ${{ env.RELEASE_TAG }}
          files: sound-delay-${{ env.RELEASE_TAG }}.apk
          generate_release_notes: true
